name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息。安全问题请不要在此提交，见 SECURITY.md。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器/系统/Node 版本
      placeholder: "Safari 17.5 / macOS 15 / Node 24.19"
  - type: textarea
    id: logs
    attributes:
      label: 控制台或构建日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，未发现重复
          required: true
