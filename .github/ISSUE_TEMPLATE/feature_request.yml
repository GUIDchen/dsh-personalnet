name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前的不便或缺失是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何解决？可附参考实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 文档
        - 设计/样式
        - 内容模型
        - 构建/部署
        - 可访问性/性能
        - 其他
