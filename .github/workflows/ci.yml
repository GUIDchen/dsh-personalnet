name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm test:docs
      - run: pnpm test:content
      - run: pnpm check:site
      - run: pnpm check:media
      - run: pnpm check:github
      - run: pnpm check:admin
      - run: pnpm check:contrast
      - run: pnpm test:integration
      - run: pnpm test:seo
      - run: pnpm check:budget
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
